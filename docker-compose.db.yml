services:
  postgres:
    image: ${LOCAL_POSTGRES_IMAGE:-postgres:17}
    container_name: armadacms-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: armadacms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d armadacms"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
