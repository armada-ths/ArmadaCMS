# Development compose: Go backend with Air hot-reload.
# Start it through scripts/dev-up.ps1 so the minimal local Supabase services
# are ready and their generated credentials are passed to this container.
#
# Go changes → Air rebuilds automatically
# Start the frontend separately from frontend/ for Vite HMR
# API served at http://localhost:8080

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    env_file:
      - .env
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: "54322"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: postgres
      DB_SSLMODE: disable
      S3_BUCKET: armadacms-files
      S3_ENDPOINT: http://host.docker.internal:54321/storage/v1/s3
      S3_PUBLIC_URL: http://127.0.0.1:54321/storage/v1/object/public
      S3_REGION: ${LOCAL_SUPABASE_S3_REGION:-local}
      AWS_ACCESS_KEY_ID: ${LOCAL_SUPABASE_S3_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${LOCAL_SUPABASE_S3_SECRET_KEY:-}
      jwtsecret_laganda: ${jwtsecret_laganda:-local-development-only-secret}
      PHOTO_S3_BUCKET: event-photos
      PHOTO_EXPORT_S3_BUCKET: event-photo-exports
      PHOTO_S3_PRESIGN_ENDPOINT: http://127.0.0.1:54321/storage/v1/s3
      PHOTO_TOKEN_SECRET: ${PHOTO_TOKEN_SECRET:-local-development-photo-token-secret-change-before-deploy}
      PHOTO_APP_BASE_URL: http://localhost:8001
      PHOTO_RECAPTCHA_BYPASS_LOCAL: "true"
      PHOTO_VISION_MOCK_RESULT: ${PHOTO_VISION_MOCK_RESULT:-safe}
    networks:
      - backend

volumes:
  go-mod-cache:
  go-build-cache:

networks:
  backend:
