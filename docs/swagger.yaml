      produces:
      - application/json
      responses:
        "200":
          description: Deleted
          schema:
            type: string
        "404":
          description: employment not found
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Delete employment
      tags:
      - employments
    get:
      parameters:
      - description: Employment ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Employment'
        "404":
          description: employment not found
          schema:
            type: string
      summary: Get employment by ID
