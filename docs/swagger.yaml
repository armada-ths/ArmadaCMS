basePath: /api/v1
definitions:
  controllers.loginRequest:
    properties:
      password:
        example: s3cr3t
        type: string
      username:
        example: admin
        type: string
    type: object
  controllers.recruitmentPeriodPayload:
    properties:
      endDate:
        type: string
      eventroId:
        type: string
      link:
        type: string
      name:
        type: string
      startDate:
        type: string
    type: object
  controllers.recruitmentRolePayload:
    properties:
      description:
        type: string
      eventroRoleId:
        type: string
      name:
        type: string
      recruitmentId:
        type: integer
      team_id:
        type: integer
    type: object
  controllers.userBody:
    properties:
      avatar:
        type: string
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      password:
        type: string
      role_id:
        type: integer
      updated_at:
        type: string
      username:
        type: string
    type: object
  models.AuditLog:
    properties:
      action:
        type: string
      actor_name:
        type: string
      actor_user_id:
        type: integer
      actor_username:
        type: string
      created_at:
        type: string
      http_method:
        type: string
      id:
        type: integer
      new_data:
        type: string
      old_data:
        type: string
      request_path:
        type: string
      resource_id:
        type: string
      resource_type:
        type: string
    type: object
  models.Blogpost:
    properties:
      author:
        type: string
      createdAt:
        type: string
      id:
        type: integer
      imageUrl:
        type: string
      showCoverInPost:
        type: boolean
      text:
        type: string
      title:
        type: string
      userId:
        type: integer
    type: object
  models.Employment:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  models.Event:
    properties:
      description:
        type: string
      eventEnd:
        type: string
      eventMaxCapacity:
        type: integer
      eventStart:
        type: string
      eventroId:
        type: string
      fee:
        type: string
      food:
        type: string
      id:
        type: integer
      imageUrl:
        type: string
      location:
        type: string
      name:
        type: string
      registrationEnd:
        type: string
      registrationRequired:
        type: boolean
      show:
        type: boolean
      signupLink:
        type: string
    type: object
  models.Exhibitor:
    properties:
      about:
        type: string
      cities:
        type: string
      climateCompensation:
        type: boolean
      companyWebsite:
        type: string
      employments:
        items:
          $ref: '#/definitions/models.Employment'
        type: array
      eventroId:
        type: string
      fairLocation:
        type: string
      flyer:
        type: string
      id:
        type: integer
      industries:
        items:
          $ref: '#/definitions/models.Industry'
        type: array
      locationSpecial:
        type: string
      logoFreesize:
        type: string
      logoSquared:
        type: string
      mapImg:
        type: string
      name:
        type: string
      programs:
        items:
          $ref: '#/definitions/models.Program'
        type: array
      purpose:
        type: string
      tier:
        $ref: '#/definitions/models.Tier'
      type:
        type: string
      vyerPosition:
        type: string
    type: object
  models.FairDate:
    properties:
      events:
        properties:
          end:
            type: string
          start:
            type: string
        type: object
      fair:
        properties:
          days:
            items:
              type: string
            type: array
          description:
            type: string
        type: object
      fr:
        properties:
          end:
            type: string
          start:
            type: string
        type: object
      ir:
        properties:
          acceptance:
            type: string
          end:
            type: string
          start:
            type: string
        type: object
      ticket:
        properties:
          end:
            type: string
        type: object
    type: object
  models.FairDateConfig:
    properties:
      description:
        type: string
      eventsEnd:
        type: string
      eventsStart:
        type: string
      fairDays:
        description: Comma-separated dates, e.g. "2026-11-17,2026-11-18"
        type: string
      frEnd:
        type: string
      frStart:
        type: string
      id:
        type: integer
      irAcceptance:
        type: string
      irEnd:
        type: string
      irStart:
        type: string
      ticketEnd:
        description: Nullable
        type: string
    type: object
  models.FeatureFlag:
    properties:
      description:
        type: string
      enabled:
        type: boolean
      id:
        type: integer
      key:
        type: string
    type: object
  models.HighlightCard:
    properties:
      brand:
        description: Nullable with default
        type: string
      ctaEventName:
        description: 'Nullable: event name for tracking'
        type: string
      description:
        type: string
      id:
        type: integer
      linkText:
        description: Nullable
        type: string
      linkUrl:
        description: Nullable
        type: string
      subtitle:
        type: string
      title:
        type: string
    type: object
  models.Industry:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  models.OrganizationGroup:
    properties:
      name:
        type: string
      people:
        items:
          $ref: '#/definitions/models.Person'
        type: array
    type: object
  models.Person:
    properties:
      email:
        type: string
      id:
        type: integer
      linkedin_url:
        type: string
      name:
        type: string
      picture:
        type: string
      rank:
        type: string
      role:
        type: string
    type: object
  models.Profile:
    properties:
      email:
        type: string
      eventro_key:
        type: string
      id:
        type: integer
      linkedin:
        type: string
      name:
        type: string
      photo:
        type: string
      rank:
        type: string
      team:
        $ref: '#/definitions/models.Team'
      team_id:
        type: integer
      title:
        type: string
    type: object
  models.Program:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  models.RecruitmentPeriod:
    properties:
      endDate:
        type: string
      eventroId:
        type: string
      id:
        type: integer
      link:
        type: string
      name:
        type: string
      roles:
        items:
          $ref: '#/definitions/models.RecruitmentRole'
        type: array
      startDate:
        type: string
    type: object
  models.RecruitmentRole:
    properties:
      description:
        type: string
      eventroRoleId:
        type: string
      id:
        type: integer
      name:
        type: string
      recruitment:
        $ref: '#/definitions/models.RecruitmentPeriod'
      recruitmentId:
        type: integer
      team:
        $ref: '#/definitions/models.Team'
      team_id:
        type: integer
    type: object
  models.Role:
    properties:
      id:
        type: integer
      name:
        type: string
      permissions:
        items:
          type: string
        type: array
    type: object
  models.Team:
    properties:
      id:
        type: integer
      team_name:
        type: string
    type: object
  models.Tier:
    enum:
    - Standard
    - Bronze
    - Silver
    - Gold
    type: string
    x-enum-varnames:
    - TierStandard
    - TierBronze
    - TierSilver
    - TierGold
  models.Tokens:
    properties:
      accessToken:
        type: string
      refreshToken:
        type: string
    type: object
  models.User:
    properties:
      avatar:
        type: string
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      role:
        $ref: '#/definitions/models.Role'
      role_id:
        type: integer
      updated_at:
        type: string
      username:
        type: string
    type: object
info:
  contact:
    name: THS Armada Development
    url: https://github.com/armada-ths
  description: REST API powering the THS Armada career fair website (armada.nu) and
    its admin panel.
  title: ArmadaCMS API
  version: "1.0"
paths:
  /auditlogs:
    get:
      parameters:
      - description: Pagination range, e.g. [0,24]
        in: query
        name: range
        type: string
      - description: Sort, e.g. [\
        in: query
        name: sort
        type: string
      - description: 'Filter. Supported keys: action, resource_type, resource_id,
          actor_username, http_method, q (full-text)'
        in: query
        name: filter
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            Content-Range:
              description: auditlogs 0-24/1000
              type: string
          schema:
            items:
              $ref: '#/definitions/models.AuditLog'
            type: array
      security:
      - BearerAuth: []
      summary: List audit logs
      tags:
      - audit-logs
  /auditlogs/{id}:
    get:
      parameters:
      - description: AuditLog ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AuditLog'
        "404":
          description: Audit log entry not found
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get audit log by ID
      tags:
      - audit-logs
  /blogposts:
    get:
      parameters:
      - description: Pagination range, e.g. [0,24]
        in: query
        name: range
        type: string
      - description: Sort, e.g. [\
        in: query
        name: sort
        type: string
      - description: Filter
        in: query
        name: filter
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            Content-Range:
              description: blogposts 0-24/100
              type: string
          schema:
            items:
              $ref: '#/definitions/models.Blogpost'
            type: array
      summary: List blog posts
      tags:
      - blogposts
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Title
        in: formData
        name: title
        required: true
        type: string
      - description: Markdown content
        in: formData
        name: text
        required: true
        type: string
      - description: Author name
        in: formData
        name: author
        required: true
        type: string
      - description: Cover image
        in: formData
        name: file
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Blogpost'
        "400":
          description: Bad request
          schema:
            type: string
        "500":
          description: Create failed
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Create blog post
      tags:
      - blogposts
  /blogposts/{id}:
    delete:
      parameters:
      - description: Blogpost ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: Deleted
        "404":
          description: Blogpost not found
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Delete blog post
      tags:
      - blogposts
    get:
      parameters:
      - description: Blogpost ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Blogpost'
        "404":
          description: Blogpost not found
          schema:
            type: string
      summary: Get blog post by ID
      tags:
      - blogposts
    put:
      consumes:
      - multipart/form-data
      parameters:
      - description: Blogpost ID
        in: path
        name: id
        required: true
        type: integer
      - description: Title
        in: formData
        name: title
        type: string
      - description: Markdown content
        in: formData
        name: text
        type: string
      - description: Author name
        in: formData
        name: author
        type: string
      - description: Cover image
        in: formData
        name: file
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Blogpost'
        "400":
          description: Bad request
          schema:
            type: string
        "404":
          description: Not found
          schema:
            type: string
        "500":
          description: Update failed
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Update blog post
      tags:
      - blogposts
  /blogposts/upload:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Image file
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: url
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request
          schema:
            type: string
        "500":
          description: Upload failed
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Upload blog inline image
      tags:
      - blogposts
  /customusers:
    get:
      parameters:
      - description: Pagination range, e.g. [0,24]
        in: query
        name: range
        type: string
      - description: Sort, e.g. [\
        in: query
        name: sort
        type: string
      - description: Filter, e.g. {\
        in: query
        name: filter
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            Content-Range:
              description: users 0-24/100
              type: string
          schema:
            items:
              $ref: '#/definitions/models.User'
            type: array
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: List users
      tags:
      - users
    post:
      consumes:
      - application/json
      parameters:
      - description: User data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controllers.userBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Invalid body
          schema:
            type: string
        "500":
          description: Create failed
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Create user
      tags:
      - users
  /customusers/{id}:
    delete:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Deleted
          schema:
            type: string
        "404":
          description: Not found
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Delete user
      tags:
      - users
    get:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "404":
          description: User not found
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get user by ID
      tags:
      - users
    put:
      consumes:
      - application/json
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated user data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controllers.userBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Invalid data
          schema:
            type: string
        "404":
          description: Not found
          schema:
            type: string
        "500":
          description: Update failed
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Update user
      tags:
      - users
  /dates:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.FairDate'
      summary: Get public fair dates
      tags:
      - public
  /employments:
    get:
      parameters:
      - description: Pagination range, e.g. [0,24]
        in: query
        name: range
        type: string
      - description: Sort, e.g. [\
        in: query
        name: sort
        type: string
      - description: Filter, e.g. {\
        in: query
        name: filter
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            Content-Range:
              description: employments 0-24/10
              type: string
          schema:
            items:
              $ref: '#/definitions/models.Employment'
            type: array
      summary: List employment types
      tags:
      - employments
    post:
      consumes:
      - application/json
      parameters:
      - description: Employment data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.Employment'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Employment'
        "400":
          description: Invalid body
