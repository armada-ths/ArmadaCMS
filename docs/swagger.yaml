      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Employment'
        "400":
          description: Invalid data
          schema:
            type: string
        "404":
          description: Not found
          schema:
            type: string
        "500":
          description: Update failed
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Update employment
      tags:
      - employments
  /eventroevents:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Event'
            type: array
        "500":
          description: Failed to fetch from Eventro
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Sync & list events from Eventro
      tags:
      - eventro
  /eventroexhibitors:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Exhibitor'
            type: array
        "500":
          description: Failed to fetch from Eventro
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Sync & list exhibitors from Eventro
