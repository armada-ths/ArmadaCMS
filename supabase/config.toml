# ArmadaCMS Supabase local-development scaffold.
#
# Hosted production and its persistent staging branch are used remotely. This
# file configures the local Supabase stack; it does not manage hosted branch
# lifecycle or per-PR GCP preview services.
#
# Storage's S3-compatible protocol is enabled locally. ArmadaCMS uses the same
# generic S3 environment variables for local and hosted Supabase Storage.
project_id = "armadacms"

[db]
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = false
api_url = "http://127.0.0.1"

[realtime]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.s3_protocol]
enabled = true

[auth]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[local_smtp]
enabled = false

[remotes.staging]
project_id = "dqeikqjiztvmifmnbzbf"
