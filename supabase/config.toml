# ArmadaCMS Supabase local-development scaffold.
#
# This is the first migration-phase setup: local CLI workflow, migrations, and
# seeds. Hosted paid features such as persistent staged branches and ephemeral
# preview branches are intentionally deferred until billing is configured.
#
# Storage is enabled locally so we can evolve toward Supabase Storage, but the
# ArmadaCMS application still uses MinIO/AWS-compatible uploads until the
# backend storage abstraction is migrated.
project_id = "armadacms"

[db]
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
api_url = "http://127.0.0.1"

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.s3_protocol]
enabled = true

[auth]
enabled = false
