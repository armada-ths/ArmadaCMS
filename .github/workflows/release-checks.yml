name: release checks

on:
  workflow_call:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-release-checks-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test release and HTTP verification
        run: python3 -m unittest discover -s scripts/tests -t . -v
