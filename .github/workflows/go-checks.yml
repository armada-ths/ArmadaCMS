name: go checks

on:
  push:
    branches:
      - main
      - staging
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - ".github/workflows/go-checks.yml"
  pull_request:

permissions:
  pull-requests: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.filter.outputs.go }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect Go changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
              - '.github/workflows/go-checks.yml'

  vet:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run go vet
        run: go vet ./...

  lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint v2
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: golangci-lint run

  test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run go test
        run: go test -race -count=1 ./...

  go-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, vet, lint, test]
    if: always()
    steps:
      - name: All checks passed or skipped
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          GO_CHANGED: ${{ needs.changes.outputs.go }}
          VET_RESULT: ${{ needs.vet.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Go change detection did not succeed: $CHANGES_RESULT"
            exit 1
          fi
          if [[ "$GO_CHANGED" != "true" && "$GO_CHANGED" != "false" ]]; then
            echo "Go change detection returned an unexpected value: $GO_CHANGED"
            exit 1
          fi

          expected_result="skipped"
          if [[ "$GO_CHANGED" == "true" ]]; then
            expected_result="success"
          fi

          for result in "$VET_RESULT" "$LINT_RESULT" "$TEST_RESULT"; do
            if [[ "$result" != "$expected_result" ]]; then
              echo "Unexpected Go check result: $result (expected $expected_result)."
              exit 1
            fi
          done

          echo "All required Go checks have the expected result: $expected_result."
