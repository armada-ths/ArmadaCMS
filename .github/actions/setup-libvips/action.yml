name: Setup libvips
description: Install libvips with a shared package cache and bounded mirror fallback.
runs:
  using: composite
  steps:
    - name: Identify libvips package cache
      id: cache
      shell: bash
      run: |
        # shellcheck source=/dev/null
        source /etc/os-release
        fingerprint=$(cat "$GITHUB_ACTION_PATH/action.yml" "$GITHUB_ACTION_PATH/install.sh" | sha256sum | cut -d ' ' -f 1)
        # Refresh weekly; never restore packages across runner images or script changes.
        prefix="libvips-apt-v1-${VERSION_ID}-$(dpkg --print-architecture)-${ImageVersion:?}-$fingerprint"
        echo "key=$prefix-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
        echo "prefix=$prefix-" >> "$GITHUB_OUTPUT"
        echo "path=$RUNNER_TEMP/libvips-apt-cache" >> "$GITHUB_OUTPUT"

    - name: Cache libvips packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.cache.outputs.path }}
        key: ${{ steps.cache.outputs.key }}
        restore-keys: ${{ steps.cache.outputs.prefix }}

    - name: Download and install libvips
      shell: bash
      env:
        VIPS_APT_CACHE: ${{ steps.cache.outputs.path }}
      run: bash "$GITHUB_ACTION_PATH/install.sh"
